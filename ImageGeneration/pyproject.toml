[project]
name = "imagegeneration"
version = "0.1.0"
description = "Rectified Flow image generation, PyTorch only"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torch-fidelity==0.4.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "ml-collections>=1.1",
    "absl-py>=2.1",
    "tensorboard>=2.18",
    "scikit-image>=0.26.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "lmdb>=2.3.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
